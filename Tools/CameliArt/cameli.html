<!doctype html>
<!--
  Cameli's layers, as the game composites them in CameliFigure; the drawing itself is in cameli.js. render.sh opens
  this page once per layer (?layer=...) in headless Chrome and saves a transparent PNG to Assets/Resources/CameliArt/.
  ?layer=preview shows every layer stacked, tinted, for a quick look.
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
<body>
<script src="cameli.js"></script>
<script>
  const layer = new URLSearchParams(location.search).get("layer") || "preview";
  const inner = layer === "preview" ? CameliArt.figure("#F07A4A") : CameliArt.layer(layer);
  document.body.innerHTML = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
</script>
</body>
